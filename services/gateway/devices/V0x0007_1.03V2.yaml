yaml_version: 1.00.00
Device Description:
  type: Controller
  Device ID: '0x0007'
  Software Version: 1.03.00
  hw_sw_set:
    address: 60191
    length: 4
    default_value: 0xFFFFFFFF
  units_handling:
  - id: UNIT_TEMPERATURE
    selection_param: PARAM_IHM_TEMP_UNIT
  access_level:
    password_input: PARAM_SESSION_OPEN
    read_access_level: STATUS_ID_CURRENT_ACCESS_LEVEL
characteristics:
  parameters:
  - id: PARAM_INFO_DEVICE_ID
    type: unsigned integer
    name: Device ID
    acronym: Info_01
    description: '-'
    address: 60000
    min_value: 0.0
    max_value: 65535.0
    default_value: 0.0
    is_read_only: true
    write_access_level: 3
    hw_sw_set_mask: 4294967295
  - id: PARAM_INFO_SW_VERSION
    type: unsigned integer
    name: Software Version
    acronym: Info_02
    description: '-'
    address: 60001
    min_value: 0.0
    max_value: 65535.0
    default_value: 0.0
    is_read_only: true
    write_access_level: 3
    hw_sw_set_mask: 4294967295
  - id: PARAM_SESSION_OPEN
    type: unsigned integer
    name: Password input
    acronym: P00
    description: Parameter to be written with the password for accessing parameters
    address: 60169
    min_value: 0.0
    max_value: 65535.0
    default_value: 0.0
    is_write_only: true
    hw_sw_set_mask: 4294967295
  - id: PARAM_PSWD_LEVEL1
    type: unsigned integer
    name: Level 1 password
    acronym: P01
    description: Value of the level 1 password
    address: 60166
    min_value: 1.0
    max_value: 999.0
    default_value: 111.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_PSWD_LEVEL2
    type: unsigned integer
    name: Level 2 password
    acronym: P02
    description: Value of the level 2 password
    address: 60167
    min_value: 1.0
    max_value: 999.0
    default_value: 222.0
    read_access_level: 2
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_PSWD_LEVEL_CTRL_ENABLE
    type: enum
    fields:
    - index: 0
      name: Disable
    - index: 1
      name: Enable
    name: Control port acess level enable
    acronym: P03
    description: Enabler of the access level management for control port
    address: 60164
    min_value: 0.0
    max_value: 1.0
    default_value: 0.0
    read_access_level: 2
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_PSWD_LEVEL_RS485_ENABLE
    type: enum
    fields:
    - index: 0
      name: Disable
    - index: 1
      name: Enable
    name: RS485 port acess level enable
    acronym: P04
    description: Enabler of the access level management for RS485 port
    address: 60165
    min_value: 0.0
    max_value: 1.0
    default_value: 0.0
    read_access_level: 2
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_SETPOINT
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Setpoint
    acronym: t00
    description: 'Control range: t00 to t00 + t01'
    address: 60002
    min_value: -99.9
    max_value: 99.9
    default_value: 4.0
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_HYSTERESIS
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Hysteresis
    acronym: t01
    description: 'Control range: t00 to t00 + t01'
    address: 60003
    min_value: 1.0
    max_value: 99.9
    default_value: 2.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
    is_delta: true
  - id: PARAM_TH_MIN_SETPOINT
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Setpoint Minimum
    acronym: t02
    description: Minimum value for t00
    address: 60004
    min_value: -99.9
    max_value: 99.9
    default_value: -30.0
    read_access_level: 1
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_MAX_SETPOINT
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Setpoint Maximum
    acronym: t03
    description: Maximum value for t00
    address: 60005
    min_value: -99.9
    max_value: 99.9
    default_value: 30.0
    read_access_level: 1
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_PULLDOWN_STARTUP_EN
    type: enum
    fields:
    - index: 0
      name: Disable
    - index: 1
      name: Enable
    name: Pulldown at startup
    acronym: t04
    description: If enabled, trigger a pulldown at startup even if compartment temperature is below t06.
    address: 60006
    min_value: 0.0
    max_value: 1.0
    default_value: 1.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_PULLDOWN_TEMP_TRIG
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Pulldown trigger temperature
    acronym: t05
    description: If compartment temperature goes above t06, enters pulldown state
    address: 60007
    min_value: -99.9
    max_value: 99.9
    default_value: 8.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_PULLDOWN_SPEED
    type: integer
    unit: RPM
    name: Pulldown speed
    acronym: t06
    description: Compressor speed during pulldown
    address: 60008
    min_value: 1000.0
    max_value: 7000.0
    default_value: 4500.0
    read_access_level: 1
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_RECOVERY_DELTA_TEMP
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Temperature recovery offset
    acronym: t07
    description: Offset temperature below default for recovery termination. On-Off from cut-out and VCC from SP
    address: 60009
    min_value: 0.0
    max_value: 10.0
    default_value: 0.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
    is_delta: true
  - id: PARAM_TH_PROBE_FAULT_ON_TIME
    type: integer
    unit: min
    name: 'Faulty probe: ON time'
    acronym: t08
    description: Time ON when cabinet probe is unavailable, work with fixed duty cycle
    address: 60010
    min_value: 1.0
    max_value: 600.0
    default_value: 15.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_PROBE_FAULT_OFF_TIME
    type: integer
    unit: min
    name: 'Faulty probe: OFF time'
    acronym: t09
    description: Time OFF When cabinet probe is unavailable, work with fixed duty cycle
    address: 60011
    min_value: 1.0
    max_value: 600.0
    default_value: 5.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_TH_PROBE_FAULT_SPEED
    type: integer
    unit: RPM
    name: 'Faulty probe: Speed'
    acronym: t10
    description: Compressor speed when cabinet probe is unavailable, working with fixed duty cycle and fixed speed
    address: 60012
    min_value: 1000.0
    max_value: 7000.0
    default_value: 3600.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 3932160
  - id: PARAM_TH_PULLDOWN_TIMEOUT
    type: integer
    unit: hrs
    name: Pulldown timeout
    acronym: t11
    description: '-'
    address: 60140
    min_value: 1.0
    max_value: 999.0
    default_value: 24.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_COMP_CTRL_TYPE
    type: enum
    fields:
    - index: 0
      name: ON-OFF
    - index: 1
      name: Variable Speed
    name: Compressor type
    acronym: C00
    description: Define if compressor is ON/OFF or VCC
    address: 60013
    min_value: 0.0
    max_value: 1.0
    default_value: 0.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 3932160
  - id: PARAM_COMP_MIN_OFF_TIME
    type: integer
    unit: min
    name: Minimum OFF time
    acronym: C01
    description: Defines the minimum time the compressor must be off before starting. In case the compartment temperature
      rise above cut-in before C01 time, the compressor will wait until C01 time is reached before starting. It is a compressor
      reliability parameter, so it does not delay the fan starting control.
    address: 60014
    min_value: 0.0
    max_value: 60.0
    default_value: 3.0
    read_access_level: 1
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_COMP_MIN_ON_TIME
    type: integer
    unit: min
    name: Minimum ON time
    acronym: C02
    description: Defines the minimum time the compressor must be on before turning off to guarantee oil return and lubrication.
      In case the compartment temperature fall below cut-off C02 time, the compressor will continue on until C02 time is reached.
      If any alarm is configured to turn off compressor it overwrites the C02 rule.
    address: 60015
    min_value: 0.0
    max_value: 60.0
    default_value: 3.0
    read_access_level: 1
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_COMP_MIN_START_PERIOD
    type: integer
    unit: min
    name: Consecutive start minimum time
    acronym: C03
    description: Defines the time between two consecutive compressor starts. It is related to compressor and electricals reliability
      to avoid high cycle rate. It is an additional rule to C01 and C02 and will be active only if C03 < C01+C02.
    address: 60016
    min_value: 0.0
    max_value: 60.0
    default_value: 6.0
    read_access_level: 1
    write_access_level: 2
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TYPE
    type: enum
    fields:
    - index: 0
      name: Disabled
    - index: 1
      name: Heater
    - index: 2
      name: Hotgas
    - index: 3
      name: Off-Cycle
    name: Defrost type
    acronym: d00
    description: Defines the defrost type
    address: 60017
    min_value: 0.0
    max_value: 3.0
    default_value: 1.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TIMEOUT_VALUE
    type: integer
    unit: min
    name: Defrost timeout
    acronym: d01
    description: Define the maximum defrost duration, if the timeout d01 is reached the defrost is terminated even if defrost
      termination temperature is not reached.
    address: 60018
    min_value: 0.0
    max_value: 999.0
    default_value: 30.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_EVAP_TEMP_VALUE
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Defrost termination temperature
    acronym: d02
    description: Define the evaporator temperature for defrost end. In case of two evaporator probes, both must reach it to
      end the defrost.
    address: 60019
    min_value: -50.0
    max_value: 50.0
    default_value: 12.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_MAX_EVAP_TEMP_VALUE
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Temperature that finishes a defrost if any evaporator probe reaches it
    acronym: d03
    description: Define the evaporator temperature for defrost end. In case of two evaporator probes, any of them reaching
      it will end the defrost.
    address: 60020
    min_value: -50.0
    max_value: 50.0
    default_value: 25.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_DRIPPING_PERIOD
    type: integer
    unit: min
    name: Dripping time
    acronym: d04
    description: Define the post defrost dripping time with all loads turned off. Exception when auxiliary relay is configured
      so at parameter d24.
    address: 60021
    min_value: 0.0
    max_value: 99.0
    default_value: 2.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TRIG
    type: enum
    fields:
    - index: 0
      name: Periodic time
    - index: 1
      name: Cumulative compressor ON time
    - index: 2
      name: RTC scheduled defrosts
    - index: 3
      name: Adaptive defrost
    name: Defrost trigger
    acronym: d05
    description: Defines which is the main defrost starting trigger.
    address: 60022
    min_value: 0.0
    max_value: 3.0
    default_value: 0.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TRIG_PERIOD
    type: integer
    unit: hrs
    name: Fixed period trigger
    acronym: d06
    description: '

      Period since last defrost after each the next defrost will be triggered when cycle cut-out is reached. The same parameter
      is used for both "Periodic time" and "Cumulative compressor ON time" triggers'
    address: 60023
    min_value: 0.0
    max_value: 500.0
    default_value: 6.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TRIG_MAX_PERIOD
    type: integer
    unit: hrs
    name: Max period between defrosts
    acronym: d07
    description: When this period between defrosts is reached a defrost is forced, independent of the cabinet temperature.
      The same parameter is used for both "Periodic time" and "Cumulative compressor ON time" triggers
    address: 60024
    min_value: 1.0
    max_value: 500.0
    default_value: 6.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TRIG_PERIOD_PULLDOWN
    type: integer
    unit: hrs
    name: Pulldown defrost period
    acronym: d08
    description: Controller enters a Pull Down state in case compartment temperature is above parameter t06. It is possible
      to configure a different fixed defrost period during the Pull Down State.
    address: 60025
    min_value: 1.0
    max_value: 500.0
    default_value: 6.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TRIG_SCHED_TIME_1
    type: restricted_hour
    unit: hrs:min/10
    name: RTC defrost trigger 1
    acronym: d09
    description: 'Defines the fixed hours for RTC defrost triger 1 (used when d05 = 2). The first two digits represent the
      hour and the last digit represents tens of minutes for 24h hour scale. E.g.: [065 -> 06:50] / [096 -> Invalid, will
      not trigger] / [123 -> 12:30] / [189 -> Invalid, will not trigger] / [210 -> 21:00]'
    address: 60026
    min_value: 0.0
    max_value: 235.0
    default_value: 10.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 16384
  - id: PARAM_DEF_TRIG_SCHED_TIME_2
    type: restricted_hour
    unit: hrs:min/10
    name: RTC defrost trigger 2
    acronym: d10
    description: 'Defines the fixed hours for RTC defrost triger 2 (used when d05 = 2). The first two digits represent the
      hour and the last digit represents tens of minutes for 24h hour scale. E.g.: [065 -> 06:50] / [096 -> Invalid, will
      not trigger] / [123 -> 12:30] / [189 -> Invalid, will not trigger] / [210 -> 21:00]'
    address: 60027
    min_value: 0.0
    max_value: 235.0
    default_value: 70.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 16384
  - id: PARAM_DEF_TRIG_SCHED_TIME_3
    type: restricted_hour
    unit: hrs:min/10
    name: RTC defrost trigger 3
    acronym: d11
    description: 'Defines the fixed hours for RTC defrost triger 3 (used when d05 = 2). The first two digits represent the
      hour and the last digit represents tens of minutes for 24h hour scale. E.g.: [065 -> 06:50] / [096 -> Invalid, will
      not trigger] / [123 -> 12:30] / [189 -> Invalid, will not trigger] / [210 -> 21:00]'
    address: 60028
    min_value: 0.0
    max_value: 235.0
    default_value: 130.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 16384
  - id: PARAM_DEF_TRIG_SCHED_TIME_4
    type: restricted_hour
    unit: hrs:min/10
    name: RTC defrost trigger 4
    acronym: d12
    description: 'Defines the fixed hours for RTC defrost triger 4 (used when d05 = 2). The first two digits represent the
      hour and the last digit represents tens of minutes for 24h hour scale. E.g.: [065 -> 06:50] / [096 -> Invalid, will
      not trigger] / [123 -> 12:30] / [189 -> Invalid, will not trigger] / [210 -> 21:00]'
    address: 60029
    min_value: 0.0
    max_value: 235.0
    default_value: 190.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 16384
  - id: PARAM_DEF_ADP_DELTA_TRIG
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Adaptive defrost delta trigger
    acronym: d13
    description: Define the temperature difference in evaporator to trigger adaptive defrost (d05 = 3). The d13 is the difference
      between clean evaporator (after defrost) and evaporator with ice formation. It should be configured to guaranteee effective
      evaporator performance, a margin to critical ice formation or partial blockage.
    address: 60030
    min_value: 0.1
    max_value: 20.0
    default_value: 3.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4194304
    is_delta: true
  - id: PARAM_DEF_ADP_FILTER_LEVEL
    type: integer
    unit: min
    name: Adaptive defrost filter 1*
    acronym: d14
    description: '-'
    address: 60031
    min_value: 0.0
    max_value: 15.0
    default_value: 5.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4194304
  - id: PARAM_DEF_ADP_STAB_FILTER_PERIOD
    type: integer
    unit: min
    name: Adaptive defrost filter 2*
    acronym: d15
    description: '-'
    address: 60032
    min_value: 1.0
    max_value: 999.0
    default_value: 10.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4194304
  - id: PARAM_DEF_ADP_TRIG_MIN_PERIOD
    type: integer
    unit: hrs
    name: Min defrost period
    acronym: d16
    description: Define the minimum defrost period for two consecutive adaptive defrost triggers. If adaptive defrost is triggered
      before d16 time, the defrost will start only after d16.
    address: 60033
    min_value: 1.0
    max_value: 100.0
    default_value: 3.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4194304
  - id: PARAM_DEF_MAX_COMP_ON_PERIOD
    type: integer
    unit: min
    name: Continuous compressor defrost trigger
    acronym: d17
    description: Define the continuoust compressor on time to trigger a defrost. It is an auxiliary rule which is used for
      all defrost trigger modes. Disabled if 0.
    address: 60034
    min_value: 0.0
    max_value: 999.0
    default_value: 0.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_TRIG_STARTUP
    type: enum
    fields:
    - index: 0
      name: Disable
    - index: 1
      name: Enable
    name: Defrost at startup
    acronym: d18
    description: Enables the execution of a defrost during startup if the initial evaporator temperature is above the "Defrost
      end temperature value"
    address: 60035
    min_value: 0.0
    max_value: 1.0
    default_value: 1.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_ABSOLUTE_TRIGGER
    type: integer
    unit: UNIT_TEMPERATURE
    multiplier: 10
    name: Temperature for defrost trigger by cold evaporator
    acronym: d19
    description: Define an absolute low evaporator temperature, below which a defrost is triggered. A low evaporator temperature
      may indicate ice formation. The d19 should not be set to a a value expected to happen during normal operation.
    address: 60036
    min_value: -99.9
    max_value: 0.0
    default_value: -50.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_SPEED
    type: integer
    unit: RPM
    name: Defrost speed
    acronym: d20
    description: Defines the VCC speed for Hot Gas Defrost (d00 = 2). Usually the most effective speed is the max speed. Rule
      not used for other defrost types.
    address: 60037
    min_value: 1000.0
    max_value: 7000.0
    default_value: 4500.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 3932160
  - id: PARAM_DEF_POST_DEFROST_SPEED
    type: integer
    unit: RPM
    name: Defrost recovery speed
    acronym: d21
    description: Define the VCC speed after a defrost, for temperature recovery. Rule is active for any defrost type.
    address: 60038
    min_value: 1000.0
    max_value: 7000.0
    default_value: 4500.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 3932160
  - id: PARAM_DEF_POST_DEFROST_TIMEOUT
    type: integer
    unit: min
    name: Defrost recovery timeout
    acronym: d22
    description: Duration the VCC will run at the defrost recovery speed (d21). After d22 time it will switch to normal control.
    address: 60039
    min_value: 0.0
    max_value: 999.0
    default_value: 60.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_PRE_DEF_PERIOD
    type: integer
    unit: min
    name: Pre-defrost duration
    acronym: d23
    description: Pre-defrost duration, where the compressor is kept OFF
    address: 60040
    min_value: 0.0
    max_value: 99.0
    default_value: 0.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_AUX_LOAD_CFG
    type: enum
    fields:
    - index: 0
      name: Disabled
    - index: 1
      name: ON during DEFROST
    - index: 2
      name: ON during DRIPPING
    - index: 3
      name: ON during DEFROST & DRIPPING
    - index: 4
      name: ON during PRE-DEFROST
    - index: 5
      name: ON during PRE-DEFROST & DEFROST
    - index: 6
      name: ON during PRE-DEFROST & DEFROST & DRIPPING
    name: Auxiliary defrost relay behavior
    acronym: d24
    description: Define if the auxiliary relay is on during pre-defrost, defrost and/or dripping.
    address: 60041
    min_value: 0.0
    max_value: 6.0
    default_value: 0.0
    read_access_level: 1
    write_access_level: 1
    hw_sw_set_mask: 4294967295
  - id: PARAM_DEF_IHM_TEMP
    type: enum
    fields:
    - index: 0
      name: Temperature at defrost start
    - index: 1
      name: Set point
    - index: 2
      name: Real temperature
    - index: 3
      name: Display DFR
