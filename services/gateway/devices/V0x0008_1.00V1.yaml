    address: 204
    min_value: 0.0
    max_value: 900.0
    default_value: 120.0
    multiplier: 10.0
    unit: °
    is_read_only: true
  - id: STATUS_ID_NACELLE_YAW
    type: unsigned integer
    name: Nacelle Yaw Angle
    acronym: S06
    description: Current nacelle yaw position
    address: 205
    min_value: 0.0
    max_value: 3600.0
    default_value: 1800.0
    multiplier: 10.0
