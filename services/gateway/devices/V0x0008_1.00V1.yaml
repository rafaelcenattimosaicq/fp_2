yaml_version: 1.00.00
Device Description:
  type: Controller
  Device ID: '0x0008'
  Software Version: 1.00.00
  hw_sw_set:
    address: 60191
    length: 4
    default_value: 0xFFFFFFFF
  access_level:
    password_input: PARAM_SESSION_OPEN
    read_access_level: STATUS_ID_CURRENT_ACCESS_LEVEL
characteristics:
  parameters:
  - id: PARAM_INFO_DEVICE_ID
    type: unsigned integer
    name: Device ID
    acronym: Info_01
    description: '-'
    address: 60000
    min_value: 0.0
    max_value: 65535.0
    default_value: 0.0
    is_read_only: true
    write_access_level: 3
    hw_sw_set_mask: 4294967295
  - id: PARAM_INFO_SW_VERSION
    type: unsigned integer
    name: Software Version
    acronym: Info_02
    description: '-'
    address: 60001
    min_value: 0.0
    max_value: 65535.0
    default_value: 0.0
    is_read_only: true
    write_access_level: 3
    hw_sw_set_mask: 4294967295
  - id: PARAM_SESSION_OPEN
    type: unsigned integer
    name: Password input
    acronym: P00
    description: Parameter to be written with the password for accessing parameters
    address: 60169
    min_value: 0.0
    max_value: 65535.0
    default_value: 0.0
    is_write_only: true
    hw_sw_set_mask: 4294967295
  - id: PARAM_CUT_IN_SPEED
    type: unsigned integer
    name: Cut-in wind speed
    acronym: P10
    description: Minimum wind speed for turbine activation
    address: 100
    min_value: 0.0
    max_value: 500.0
    default_value: 35.0
    multiplier: 10.0
    unit: m/s
    hw_sw_set_mask: 4294967295
  - id: PARAM_CUT_OUT_SPEED
    type: unsigned integer
    name: Cut-out wind speed
    acronym: P11
    description: Maximum wind speed before emergency shutdown
    address: 101
    min_value: 0.0
    max_value: 1000.0
    default_value: 250.0
    multiplier: 10.0
    unit: m/s
    hw_sw_set_mask: 4294967295
  - id: PARAM_RATED_POWER
    type: unsigned integer
    name: Rated power
    acronym: P12
    description: Nominal power output
    address: 102
    min_value: 0.0
    max_value: 50000.0
    default_value: 5000.0
    multiplier: 1.0
    unit: W
    hw_sw_set_mask: 4294967295
