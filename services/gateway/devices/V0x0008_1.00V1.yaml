yaml_version: 1.00.00
Device Description:
  type: Controller
  Device ID: '0x0008'
  Software Version: 1.00.00
characteristics:
  parameters:
  - id: PARAM_INFO_DEVICE_ID
    type: unsigned integer
    name: Device ID
    acronym: Info_01
    description: Device identification register
    address: 60000
    min_value: 0
    max_value: 65535
    is_read_only: true
  - id: PARAM_INFO_SW_VERSION
    type: unsigned integer
    name: Software Version
    acronym: Info_02
    description: Firmware version
    address: 60001
    min_value: 0
    max_value: 65535
    is_read_only: true
  - id: PARAM_MOTOR_COMMAND
    type: unsigned integer
    name: Motor command
    acronym: CMD
    description: "Motor control: 0=stop, 1=spin forward, 2=reverse, 3=brake"
    address: 1000
    min_value: 0
    max_value: 3
    default_value: 0
    fields:
    - name: Stop
      bit_offset: 0
      bit_length: 0
    - name: Forward
      bit_offset: 0
      bit_length: 1
    - name: Reverse
      bit_offset: 0
      bit_length: 2
    - name: Brake
      bit_offset: 0
      bit_length: 3
  - id: PARAM_MOTOR_SPEED
    type: unsigned integer
    name: Motor speed setpoint
    acronym: SPD
    description: "PWM duty cycle 0-255 (0=off, 255=full speed)"
    address: 1001
    min_value: 0
    max_value: 255
    default_value: 128
  status:
  - id: STATUS_ID_MOTOR_STATE
    type: enum
    name: Motor state
    acronym: S01
    description: Current motor operating state
    address: 200
    is_read_only: true
    fields:
    - name: Stopped
      bit_offset: 0
      bit_length: 0
    - name: Forward
      bit_offset: 0
      bit_length: 1
    - name: Reverse
      bit_offset: 0
      bit_length: 2
    - name: Braking
      bit_offset: 0
      bit_length: 3
  - id: STATUS_ID_MOTOR_SPEED
    type: unsigned integer
    name: Motor actual speed
    acronym: S02
    description: Current PWM duty cycle 0-255
    address: 201
    min_value: 0
    max_value: 255
    is_read_only: true
  - id: STATUS_ID_MOTOR_RPM
    type: unsigned integer
    name: Estimated RPM
    acronym: S03
    description: Estimated motor RPM based on PWM output
    address: 202
    min_value: 0
    max_value: 10000
    is_read_only: true
  - id: STATUS_ID_MOTOR_DIRECTION
    type: unsigned integer
    name: Motor direction
    acronym: S04
    description: "0=stopped, 1=forward, 2=reverse"
    address: 203
    min_value: 0
    max_value: 2
    is_read_only: true
  - id: STATUS_ID_BUS_VOLTAGE
    type: unsigned integer
    name: Supply voltage
    acronym: S05
    description: Motor supply voltage
    address: 204
    min_value: 0
    max_value: 10000
    multiplier: 1000
    unit: V
    is_read_only: true
  - id: STATUS_ID_MOTOR_CURRENT
    type: unsigned integer
    name: Motor current
    acronym: S06
    description: Estimated motor current draw
    address: 205
    min_value: 0
    max_value: 5000
    multiplier: 1000
    unit: A
    is_read_only: true
  - id: STATUS_ID_UPTIME
    type: unsigned integer
    name: Uptime
    acronym: S07
    description: Seconds since boot
    address: 206
    is_read_only: true
services:
- id: SERVICE_DATA_ACQUISITION
  graph_data:
  - id: STATUS_ID_MOTOR_SPEED
  - id: STATUS_ID_MOTOR_RPM
  - id: STATUS_ID_BUS_VOLTAGE
  - id: STATUS_ID_MOTOR_CURRENT
  table_data:
  - id: STATUS_ID_MOTOR_STATE
  - id: STATUS_ID_MOTOR_SPEED
  - id: STATUS_ID_MOTOR_RPM
  - id: STATUS_ID_MOTOR_DIRECTION
  - id: STATUS_ID_BUS_VOLTAGE
  - id: STATUS_ID_MOTOR_CURRENT
  - id: STATUS_ID_UPTIME
  config_groups: []
  storage_data: []
