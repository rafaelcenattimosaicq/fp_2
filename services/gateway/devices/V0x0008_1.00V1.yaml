    acronym: S03
    description: Current electrical power output
    address: 202
    min_value: 0.0
    max_value: 50000.0
    default_value: 3200.0
    multiplier: 1.0
    unit: W
    is_read_only: true
  - id: STATUS_ID_GENERATOR_TEMP
    type: unsigned integer
    name: Generator Temperature
    acronym: S04
