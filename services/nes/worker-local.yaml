logLevel: LOG_INFO
coordinatorHost: nes-coordinator
localWorkerHost: nes-worker
coordinatorPort: 8080
physicalSources:
  - logicalSourceName: telemetry
    physicalSourceName: gateway-mqtt
    type: MQTT_SOURCE
    configuration:
      url: "tcp://mqtt-broker:1883"
      topic: "telemetry/nes"
      clientId: "nes-local-worker"
      userName: nes
      qos: 1
      cleanSession: true
      inputFormat: CSV
      flushIntervalMS: 1000
      numberOfBuffersToProduce: 0
