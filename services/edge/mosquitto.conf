# Mosquitto configuration for edge deployments.
#
# Listens on port 1883 (plaintext MQTT) on localhost only.
# No authentication required — the gateway and broker run on the same device.

listener 1883 0.0.0.0
allow_anonymous true

# Logging to stdout for Docker container output.
log_dest stdout
log_type error
log_type warning
log_type notice
